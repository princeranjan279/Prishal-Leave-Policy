services:
  - type: web
    name: prishal-leave-hub
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        # Set a stable secret in Render's dashboard environment variables.
        # Do NOT use generateValue: true — it regenerates on every deploy,
        # instantly invalidating all active user sessions (JWT tokens).
        sync: false
